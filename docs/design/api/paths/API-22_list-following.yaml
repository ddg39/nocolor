operationId: listFollowing
summary: API-22 フォロー一覧
x-api-id: API-22
tags:
  - Users
description: |
  `GET /api/users/{username}/following`（R-22）

  ## 概要

  そのユーザーがフォローしているユーザーを、フォローした順（新しい順）に返す（PRF-05）。カーソル方式のページング（README 1.7）。

  - 関連要件 ID: PRF-05, TML-05
  - 利用画面: SCR-11
  - ログイン: 任意。ログインしていれば各項目の `is_following` を閲覧者について返す。Cookie が無効なら未ログインとして扱う（README 1.3）。

  ## レスポンス

  成功時は 200（README 1.7 の形式。`items` は UserSummary）。`is_following` は閲覧者から見た値。

  ## 備考

  - 使用テーブル: `follows`、`users`（`ListFollowing`）。
  - 並びは `(follows.created_at, 相手の内部 ID)` の降順。副作用なし。
  - カーソルは対象ユーザーと一覧の種類（フォロー一覧）に結び付く。別のユーザー・別の一覧のカーソルは 400 `INVALID_CURSOR`。
  - パスの `username` の形式が不正なときは、DB を引かずに 404 `USER_NOT_FOUND` を返す（README 1.1）。
  - 共通エラー: 想定外の障害は 500 `INTERNAL_ERROR`、一時的に処理できない場合は 503 `SERVICE_UNAVAILABLE`。
    定義のないパス・メソッドの 404・405 は個別の API には載せない（README 1.1）。
security:
  - {}
  - sessionCookie: []
parameters:
  - $ref: ../components/parameters/username.yaml
  - $ref: ../components/parameters/cursor.yaml
  - $ref: ../components/parameters/limit.yaml
responses:
  "200":
    description: |
      フォローしているユーザーの一覧。フォローした順（新しい順）。次のページが無いときは `next_cursor` が `null`。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UserSummaryPage.yaml
        examples:
          page:
            value:
              items:
                - username: bob
                  display_name: Bob
                  icon_url: null
                  bio: 白黒写真が好きです。
                  is_following: true
              next_cursor: null
  "400":
    $ref: ../components/responses/InvalidPagingParams.yaml
  "404":
    $ref: ../components/responses/UserNotFound.yaml
  "500":
    $ref: ../components/responses/InternalError.yaml
  "503":
    $ref: ../components/responses/ServiceUnavailable.yaml
