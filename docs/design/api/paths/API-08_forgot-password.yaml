operationId: forgotPassword
summary: API-08 パスワード再設定メールの申請
x-api-id: API-08
tags:
  - Auth
description: |
  `POST /api/auth/password/forgot`（R-08）

  ## 概要

  メールアドレスを受け取り、登録済みなら再設定用リンクを送る（ACC-08）。
  **登録の有無にかかわらず同じ応答にする**（ACC-09）。

  - 関連要件 ID: ACC-08, ACC-09, 6.2
  - 利用画面: SCR-06
  - ログイン: 不要。CSRF は Origin の検査のみ（README 1.4 (1)）。リクエストは `Content-Type: application/json` が必須。
  - レート制限: `reset_mail_ip` / `reset_mail_addr`（README 1.8）。アドレスの登録の有無と無関係に数える。

  ## エラー

  エラーは「形式不正」「回数超過」「キュー満杯」のようにアドレスの有無と無関係なものだけにする。

  ## 備考

  - 使用テーブル: `users`、`password_reset_tokens`、`rate_limits`。
  - **ACC-09 の担保**: 登録済み・未登録・仮登録（未確認）のいずれでも、ステータス・本文・ヘッダーが同一で、
    同期の処理経路も同一である。同期部分は検証・レート制限の計数・キューへの投入（README 1.11）だけで、
    アドレスの検索・トークン発行・メール送信は応答後の非同期ジョブで行う（API-05 と同じ）。
  - ジョブの処理: **本登録済み**のユーザーが見つかったときだけ、そのユーザーの未使用トークンを無効にして
    新しいトークン（有効期限 1 時間）を発行し、`{APP_BASE_URL}/password/reset?token=...` をメールで送る。
    仮登録のユーザーには再設定を行わない（メールアドレスの所有確認を再設定で済ませないため。db.md 4.5）。
  - 副作用: メール送信（非同期）。セッションには触れない。
  - 共通エラー: 403 `CSRF_INVALID`（Origin の検査）、413、415、500。
    定義のないパス・メソッドの 404・405 は個別の API には載せない（README 1.1）。
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            description: |
              メールアドレス（README 1.9）。前処理（前後の空白の除去と小文字化）の後に 254 文字以内
              （前処理の前の値に `maxLength` は付けない）。`local@domain` の形で、表示名やコメントを含まず、ドメイン部に `.` を含み、
              ローカル部は 64 文字以内。実装は Go の `net/mail` で解析し、解析結果のアドレス部が入力と一致することを確認する。
              前後の空白を除き、小文字にして照合する（db.md 3.1）ので、前処理の前の値を受けるため `format: email` は付けない。
              項目別コード: 空は `REQUIRED`、長いは `TOO_LONG`、形式は `INVALID_FORMAT`（形式のみ。存在とは無関係）。
      examples:
        forgot:
          value:
            email: alice@example.com
responses:
  "202":
    description: |
      受け付けた。アドレスが登録済み・未登録・仮登録のどれでも、ステータス・本文・ヘッダーは同じ（ACC-09）。
      メールは条件に合う場合だけ非同期に送る。
    content:
      application/json:
        schema:
          type: object
          required:
            - accepted
          properties:
            accepted:
              type: boolean
              const: true
              description: 常に `true`。
        examples:
          accepted:
            value:
              accepted: true
  "400":
    $ref: ../components/responses/ValidationError.yaml
  "403":
    $ref: ../components/responses/CsrfInvalid.yaml
  "413":
    $ref: ../components/responses/RequestTooLarge.yaml
  "415":
    $ref: ../components/responses/UnsupportedMediaType.yaml
  "429":
    $ref: ../components/responses/RateLimited.yaml
  "500":
    $ref: ../components/responses/InternalError.yaml
  "503":
    $ref: ../components/responses/ServiceUnavailableQueueFull.yaml
