operationId: resetPassword
summary: API-10 パスワードの再設定
x-api-id: API-10
tags:
  - Auth
description: |
  `POST /api/auth/password/reset`（R-10）

  ## 概要

  再設定トークンと新しいパスワードで、パスワードを変更する（ACC-08）。
  成功時にトークンを使用済みにし、**そのユーザーの全セッションを破棄する**（6.2）。

  - 関連要件 ID: ACC-08, 6.2
  - 利用画面: SCR-07
  - ログイン: 不要。CSRF は Origin の検査のみ（README 1.4 (1)）。リクエストは `Content-Type: application/json` が必須。
  - レート制限: `token_ip`（README 1.8）。

  ## 処理順

  リクエストの処理順は次のとおり（README 1.5 の例外）。

  1. `token` の形式と有効性を読み取りで確認する。無効なら 400 `TOKEN_INVALID`（`password` が不正でもこちらを返す）。
  2. `password` を検証する。失敗は 400 `VALIDATION_ERROR`。この場合は 3 より前に返すので、**トークンは消費されず残る**。
  3. 次を 1 つのトランザクションで行う。
     1. `UPDATE password_reset_tokens SET used_at = now WHERE token_hash = ? AND used_at IS NULL AND expires_at > now` の
        影響行数が 1 であること（並行して 2 回使われても片方だけ成功する。db.md 3.3）。
     2. `users.password_hash` を更新する。
     3. そのユーザーの全セッションを削除する（`DeleteSessionsByUser`）。
     4. そのユーザーの他の未使用の再設定トークンも使用済みにする。

  1 と 3-1 の間に期限切れ等が起きても、3-1 の条件付き更新が最終的に判定し、失敗なら 400 `TOKEN_INVALID` を返す。

  ## 備考

  - 使用テーブル: `password_reset_tokens`、`users`、`sessions`、`rate_limits`。
  - 副作用: **全セッションの破棄**。リクエストに有効なセッションの Cookie が付いていた場合は、
    そのセッションも破棄されるため、応答で Cookie を削除する。自動ログインはしない（screens 3.4.3）。
  - 対象は本登録済みのユーザーのトークンだけである（API-08 が仮登録には発行しない）。
  - bcrypt の 72 バイト制限は実装が事前ハッシュで吸収する（設計判断 D-15）。
  - 共通エラー: 403 `CSRF_INVALID`（Origin の検査）、413、415、500、503。
    定義のないパス・メソッドの 404・405 は個別の API には載せない（README 1.1）。
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
            description: |
              再設定メールのリンクのトークン。43 文字の Base64URL。
              形式違反は DB を引かず 400 `TOKEN_INVALID` を返す（`password` の検証より先に判定する）。
          password:
            type: string
            format: password
            minLength: 8
            maxLength: 32
            description: |
              新しいパスワード（4.1。README 1.9）。8〜32 文字（コードポイントで数える）。
              英字（A-Z、a-z）と数字（0-9）をそれぞれ 1 文字以上含む
              （この規則は先読みが要り RE2 で扱えないため `pattern` では表さず、実装で検査して `NEED_LETTER_AND_DIGIT` を返す）。加工しない（空白も含めて保存対象。Unicode の正規化もしない）。
              項目別コード: 空は `REQUIRED`、短いは `TOO_SHORT`、長いは `TOO_LONG`、文字種は `NEED_LETTER_AND_DIGIT`。
      examples:
        reset:
          value:
            token: q8Yx0m2kZp7Lw3Nf9RtV1sBc5HdGe6JaUoXiYb4MqKc
            password: NewPassw0rd
responses:
  "204":
    description: |
      パスワードを変更した（ボディなし）。そのユーザーの全セッションを破棄した。自動ログインはしない。
      リクエストに有効なセッションの Cookie が付いていた場合は、応答で同名の Cookie を `Max-Age=0` で削除する。
    headers:
      Set-Cookie:
        description: リクエストに有効なセッションの Cookie が付いていた場合のみ。Cookie `nocolor_session` を削除する（`Max-Age=0`）。
        required: false
        schema:
          type: string
  "400":
    description: |
      400。次のいずれか。
      - `TOKEN_INVALID`: トークンが存在しない・期限切れ（1 時間）・使用済み・形式不正。`password` の検証より先に判定する。
      - `VALIDATION_ERROR`: `fields.password` = `REQUIRED` / `TOO_SHORT` / `TOO_LONG` / `NEED_LETTER_AND_DIGIT`。トークンは消費されない。
      - `BAD_REQUEST`: JSON として解釈できない（不正な UTF-8 を含む場合を含む）、または項目の型が違う。`fields` は `{}`。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Error.yaml
        examples:
          tokenInvalid:
            value:
              error:
                code: TOKEN_INVALID
                message: このリンクは無効か、期限が切れています。
                fields: {}
                request_id: 7f3c9b1e2a4d4c0e9a51
          validationError:
            value:
              error:
                code: VALIDATION_ERROR
                message: 入力内容を確認してください。
                fields:
                  password: NEED_LETTER_AND_DIGIT
                request_id: 7f3c9b1e2a4d4c0e9a51
  "403":
    $ref: ../components/responses/CsrfInvalid.yaml
  "413":
    $ref: ../components/responses/RequestTooLarge.yaml
  "415":
    $ref: ../components/responses/UnsupportedMediaType.yaml
  "429":
    $ref: ../components/responses/RateLimited.yaml
  "500":
    $ref: ../components/responses/InternalError.yaml
  "503":
    $ref: ../components/responses/ServiceUnavailable.yaml
