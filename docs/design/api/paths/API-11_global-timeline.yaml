operationId: listGlobalTimeline
summary: API-11 全体タイムライン
x-api-id: API-11
tags:
  - Timelines
description: |
  `GET /api/timelines/global`（R-11）

  ## 概要

  全ユーザーの投稿を新着順に返す（TML-02）。未ログインでも使える（TML-04）。

  ## 備考

  - 関連要件 ID: TML-01, TML-02, TML-04, TML-05, TML-06, LIK-03
  - 利用画面: SCR-01
  - 使用テーブル: `posts`、`users`、`likes`（`ListGlobalTimeline`）。
  - 副作用なし。
  - 未ログインは閲覧者 ID を 0 として `liked_by_me` を `false` にする。Cookie が無効でも 401 にせず未ログインとして扱う（README 1.3）。
  - 並びは `posts.id` の降順。ページングの仕組みと「重複・欠落しない」理由は README 1.7。
  - 共通エラー: 想定外の障害は 500 `INTERNAL_ERROR`、一時的に処理できない場合は 503 `SERVICE_UNAVAILABLE`。
    定義のないパス・メソッドは 404 `NOT_FOUND`・405 `METHOD_NOT_ALLOWED`（README 1.1。個別の API には載せない）。
security:
  - {}
  - sessionCookie: []
parameters:
  - $ref: ../components/parameters/cursor.yaml
  - $ref: ../components/parameters/limit.yaml
responses:
  "200":
    description: |
      投稿の一覧（README 1.7 の形式。`items` は Post）。次のページが無いときは `next_cursor` が `null`。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PostPage.yaml
        examples:
          page:
            value:
              items:
                - id: 01JC8ZQ4V6S2R9T3M7X5N1B0KD
                  image_url: /images/posts/3f1c2a9e-7b0d-4c8a-9d52-1e6f0a7b4c11.jpg
                  image_width: 2400
                  image_height: 1600
                  thumbnail_url: /images/thumbs/a81d5e07-93c2-4b6a-8f10-5c7d2e9b0a44.jpg
                  thumbnail_width: 600
                  thumbnail_height: 400
                  caption: "朝の駅\n人はまだ少ない"
                  created_at: "2026-10-26T05:30:12.345Z"
                  like_count: 12
                  liked_by_me: false
                  author:
                    username: alice
                    display_name: Alice
                    icon_url: null
              next_cursor: AQ3v1o8Kx2m0
  "400":
    $ref: ../components/responses/InvalidPagingParams.yaml
  "500":
    $ref: ../components/responses/InternalError.yaml
  "503":
    $ref: ../components/responses/ServiceUnavailable.yaml
