operationId: followUser
summary: API-20 フォローする
x-api-id: API-20
tags:
  - Users
description: |
  `PUT /api/users/{username}/follow`（R-20）

  ## 概要

  閲覧者が、対象のユーザーをフォローする（FOL-01）。相手の承認は要らない（FOL-03）。**冪等**。

  - 関連要件 ID: FOL-01, FOL-03
  - 利用画面: SCR-10, SCR-11
  - ログイン: 必須。ボディなし。`X-CSRF-Token` が必要（Origin の検査も行う。README 1.4）。

  ## レスポンス

  成功時は 200。`following` は操作後の状態（常に `true`）、`follower_count` は操作後の**対象のユーザー**のフォロワー数。

  ## 備考

  - 使用テーブル: `follows`、`users`。`INSERT ... ON DUPLICATE KEY UPDATE`（db.md 4.4）。
  - 自分自身の検査はアプリで先に行い 400 `CANNOT_FOLLOW_SELF` を返す（DB の `CHECK` は最後の防御）。
  - すでにフォロー済みなら `created_at` を更新せず成功とする。
  - パスの `username` の形式が不正なときは、DB を引かずに 404 `USER_NOT_FOUND` を返す（README 1.1）。
  - 共通エラー: 401 `UNAUTHENTICATED`、403 `CSRF_INVALID`、500 `INTERNAL_ERROR`、503 `SERVICE_UNAVAILABLE`。
    定義のないパス・メソッドの 404・405 は個別の API には載せない（README 1.1）。
security:
  - sessionCookie: []
    csrfToken: []
parameters:
  - $ref: ../components/parameters/username.yaml
responses:
  "200":
    description: フォローした（すでにフォロー済みでも同じ）。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/FollowState.yaml
        examples:
          followed:
            value:
              following: true
              follower_count: 57
  "400":
    description: |
      400 `CANNOT_FOLLOW_SELF`。対象が閲覧者自身（FOL-01）。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Error.yaml
        examples:
          cannotFollowSelf:
            value:
              error:
                code: CANNOT_FOLLOW_SELF
                message: 自分自身をフォローすることはできません。
                fields: {}
                request_id: 7f3c9b1e2a4d4c0e9a51
  "401":
    $ref: ../components/responses/Unauthenticated.yaml
  "403":
    $ref: ../components/responses/CsrfInvalid.yaml
  "404":
    $ref: ../components/responses/UserNotFound.yaml
  "500":
    $ref: ../components/responses/InternalError.yaml
  "503":
    $ref: ../components/responses/ServiceUnavailable.yaml
