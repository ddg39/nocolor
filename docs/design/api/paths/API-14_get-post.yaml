operationId: getPost
summary: API-14 投稿の取得
x-api-id: API-14
tags:
  - Posts
description: |
  `GET /api/posts/{post_id}`（R-14）

  ## 概要

  投稿 1 件を返す（PST-07）。未ログインでも使える。

  ## 備考

  - 関連要件 ID: PST-07, LIK-03, TML-06
  - 利用画面: SCR-09
  - 使用テーブル: `posts`、`users`、`likes`（`GetPost`）。
  - 副作用なし。未ログインは `liked_by_me` が `false`。Cookie が無効でも 401 にせず未ログインとして扱う（README 1.3）。
  - パス `post_id` は 1.2 の ULID。形式が不正なときは DB を引かずに 404 `POST_NOT_FOUND`（400 ではない）。
  - 共通エラー: 想定外の障害は 500 `INTERNAL_ERROR`、一時的に処理できない場合は 503 `SERVICE_UNAVAILABLE`。
    定義のないパス・メソッドは 404 `NOT_FOUND`・405 `METHOD_NOT_ALLOWED`（README 1.1。個別の API には載せない）。
security:
  - {}
  - sessionCookie: []
parameters:
  - $ref: ../components/parameters/post_id.yaml
responses:
  "200":
    description: 投稿。本文は Post（API-11 の `items` の項目と同じ）。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Post.yaml
        examples:
          post:
            value:
              id: 01JC8ZQ4V6S2R9T3M7X5N1B0KD
              image_url: /images/posts/3f1c2a9e-7b0d-4c8a-9d52-1e6f0a7b4c11.jpg
              image_width: 2400
              image_height: 1600
              thumbnail_url: /images/thumbs/a81d5e07-93c2-4b6a-8f10-5c7d2e9b0a44.jpg
              thumbnail_width: 600
              thumbnail_height: 400
              caption: "朝の駅\n人はまだ少ない"
              created_at: "2026-10-26T05:30:12.345Z"
              like_count: 12
              liked_by_me: false
              author:
                username: alice
                display_name: Alice
                icon_url: null
  "404":
    $ref: ../components/responses/PostNotFound.yaml
  "500":
    $ref: ../components/responses/InternalError.yaml
  "503":
    $ref: ../components/responses/ServiceUnavailable.yaml
