operationId: signup
summary: API-03 仮登録
x-api-id: API-03
tags:
  - Auth
description: |
  `POST /api/auth/signup`（R-03）

  ## 概要

  メールアドレス・ユーザー名・パスワードでアカウントを仮登録し、確認メールを送る（ACC-01、ACC-02）。
  **メールアドレスの重複は画面に出さない**（登録済みのアドレスでも通常の成功と同じ応答を返し、メールで知らせる。設計判断 D-25）。

  - 関連要件 ID: ACC-01, ACC-02, ACC-05, 6.2
  - 利用画面: SCR-02
  - ログイン: 不要。CSRF は Origin の検査のみ（README 1.4 (1)）。リクエストは `Content-Type: application/json` が必須。

  ## レスポンス

  成功時は 201。`email` は正規化（前後の空白除去・小文字化）した値。画面が送信先の表示に使ってよい
  （入力した本人に返すだけなので問題ない）。パスワードは返さない。

  **メールアドレスが登録済みの場合も、ステータス・ボディ・ヘッダーは成功時と同じ**（201。`username` は入力の値をそのまま返す）。
  この場合、ユーザーは作られない。

  ## エラー

  - メールアドレスの重複を示すエラーコードは無い（`EMAIL_TAKEN` は廃止した）。応答の内容・ステータス・ヘッダーからは、
    メールアドレスの登録の有無は分からない。ただし、同じユーザー名で 2 回登録を試す方法（D-25）で推測される**既知の問題**が残る（設計判断 D-25）。
  - 検証（400）を先に行い、通ってから重複を調べる。
  - 重複判定の手順は **db.md 3.1「登録処理の流れ」を正とする**。本節はそれに合わせた API 側の記述で、食い違いがあれば db.md が優先する。

  ## 備考

  - 使用テーブル: `users`、`email_verification_tokens`、`rate_limits`。
  - **処理順**（README 1.5 の 9 にあたる部分）:
    1. 入力の検証（400）とレート制限（`signup_mail_*`。429）を行う（1.5 の 5・7・8。検証もレート制限もキューの状態に依存しない）。
    2. メール送信キューの空きを 1 つ確保する。確保できなければ 503（ユーザーは作らない）。以降で 409 や失敗になったときは、確保した枠を戻す。
       1 と 2 の順にするのは、不正な入力や制限超過のリクエストが枠を占有しないようにするため。
    3. パスワードを bcrypt でハッシュ化する（README 1.9 の 72 バイトの注意）。**以降の分岐の前に、どの経路でも必ず行う**（処理時間を揃えるため）。
    4. トランザクションを開始し、期限切れ（作成から 7 日超）の仮登録のうち、同じユーザー名または同じメールアドレスのものを削除する
       （ACC-05。`DeleteExpiredUnverifiedUsersByIdentity`）。
    5. `CreateUser`（`users` に `INSERT`。`display_name` はユーザー名と同じ値、`bio` は空、`email_verified_at` は `NULL`）を試す。
       - **成功**: 続けて確認トークン（32 バイトの乱数を Base64URL にした 43 文字。SHA-256 を保存。有効期限 24 時間）を作ってコミットし、
         確認メールのジョブ（README 1.11 の (a)）をキューに積む。
       - **一意制約違反（MySQL エラー 1062）**: ロールバックする。**どちらの制約かは、エラーメッセージのキー名では判断しない**
         （両方が重複したとき MySQL がどちらを報告するかは、インデックスの検査順に依存するため）。
         新しいトランザクションで `GetUserByUsername`（有効な仮登録を含む）を引く。
         - 見つかった: 409 `USERNAME_TAKEN`（メールアドレスも重複していても同じ。メールの有無は漏れない）。
         - 見つからない: 続けて `GetUserByEmail`（有効な仮登録を含む）を引く。
           - 見つかった: メールアドレスの重複である。ユーザーもトークンも作らず、「登録済みメールの処理ジョブ」（1.11 の (b)）を
             キューに積み、201 を返す。
           - 見つからない（両方 0 行。引いた直後に行が消えた競合）: 手順 4（期限切れ削除）からやり直す
             （1 回まで。bcrypt の再計算と枠の再確保は要らない）。やり直したあとも 1062 になり、なお両方 0 行のときは、
             503 `SERVICE_UNAVAILABLE` を返し、枠を戻す。
    6. 201 `{email, username}` を返す。成功・メール重複のどちらでも、応答の内容は同一である。
    - **同期で行うのは手順 1〜5 の範囲だけ**で、メール重複の処理（アドレスの検索、本登録済みかどうかの判定、旧トークンの削除、
      新トークンの発行、メール送信）は**すべてワーカー**が行う。同期の経路にトークンの再発行は含まれない。
  - **ジョブの内容**（README 1.11 のキューで非同期に送る。SMTP の失敗は応答に影響せずログに残す）:
    - 新規登録に成功した経路: 確認メール（`{APP_BASE_URL}/verify?token=...`）。
    - メール重複の経路で、ワーカーの判定が**本登録済み**: 「このアドレスは登録済みです。ログイン・パスワード再設定はこちら」の案内メール。
      本文にログイン画面と再設定申請画面（SCR-06）へのリンクを入れる。トークンは含めない。
    - メール重複の経路で、ワーカーの判定が**有効な仮登録**: 確認メールの再送。API-05 のジョブと同じ処理
      （既存のトークンを削除して新しいトークンを発行）。見つからなければ何もしない。作成から 7 日の期限は延びない。
    - どのメールも `signup_mail_ip` / `signup_mail_addr` で数える。API-03 の呼び出し自体が 1 回と数えられる（README 1.8）ので、
      他人のアドレスにメールを送らせる回数は、アドレスごとに 1 時間 3 回までに抑えられる。
  - **処理時間**: 両経路とも bcrypt を行い、メール送信は非同期にするので、時間の差は DB 書き込みの有無（数ミリ秒程度）だけになる。
    bcrypt のコストに比べ十分小さいため許容する。
  - ログインは**しない**。セッションは作らない。
  - 仮登録のユーザー名の占有: メール重複の経路ではユーザー名を確保しない（これが D-25 の既知の問題の原因）。
    入力された `username` は、登録済みアドレスの持ち主には何の影響も与えない。
  - 画面（SCR-02）は、成功時に常に「確認メールを送信しました」の表示にする（メールアドレス重複のエラー表示は不要）。
    ACC-09 は再設定画面のみが対象だが、同じ方針を登録にも適用した。
  - 共通エラー: 403 `CSRF_INVALID`（Origin の検査）、413 `REQUEST_TOO_LARGE`、415 `UNSUPPORTED_MEDIA_TYPE`、500 `INTERNAL_ERROR`。
    定義のないパス・メソッドの 404・405 は個別の API には載せない（README 1.1）。
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - username
          - password
        properties:
          email:
            type: string
            description: |
              メールアドレス（4.1。README 1.9）。前処理（前後の空白の除去と小文字化）の後に 254 文字以内
              （前処理の前の値に `maxLength` を付けると、空白付きの入力を誤って弾くため付けない）。`local@domain` の形で、表示名やコメントを含まず、ドメイン部に `.` を含み、
              ローカル部は 64 文字以内。実装は Go の `net/mail` で解析し、解析結果のアドレス部が入力と一致することを確認する
              （国際化メールアドレスは考慮しない）。前後の空白を除き、小文字にして保存・照合する（db.md 3.1）ので、
              前処理の前の値を受けるため `format: email` は付けない。一意（`@` 以降も含め、大文字小文字を区別しない）。
              項目別コード: 空は `REQUIRED`、長いは `TOO_LONG`、形式は `INVALID_FORMAT`。
          username:
            $ref: ../components/schemas/Username.yaml
          password:
            type: string
            format: password
            minLength: 8
            maxLength: 32
            description: |
              パスワード（4.1。README 1.9）。8〜32 文字（コードポイントで数える）。英字（A-Z、a-z）と数字（0-9）をそれぞれ 1 文字以上含む
              （この規則は先読みが要り RE2 で扱えないため `pattern` では表さず、実装で検査して `NEED_LETTER_AND_DIGIT` を返す）。
              加工しない（空白も含めて保存対象。Unicode の正規化もしない）。
              項目別コード: 空は `REQUIRED`、短いは `TOO_SHORT`、長いは `TOO_LONG`、文字種は `NEED_LETTER_AND_DIGIT`。
              bcrypt の 72 バイト制限は実装が事前ハッシュで吸収する（設計判断 D-15）。
      examples:
        signup:
          value:
            email: alice@example.com
            username: alice
            password: Passw0rdExample
responses:
  "201":
    description: |
      仮登録を受け付けた。確認メール（またはメールアドレスが登録済みの場合はその旨の案内）を非同期に送る。
      メールアドレスが登録済みの場合も、ステータス・ボディ・ヘッダーは同じ。
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - username
          properties:
            email:
              type: string
              description: 正規化（前後の空白除去・小文字化）したメールアドレス。送信先の表示に使ってよい。
            username:
              $ref: ../components/schemas/Username.yaml
        examples:
          signup:
            value:
              email: alice@example.com
              username: alice
  "400":
    $ref: ../components/responses/ValidationError.yaml
  "403":
    $ref: ../components/responses/CsrfInvalid.yaml
  "409":
    description: |
      409 `USERNAME_TAKEN`。ユーザー名が使用済み（仮登録中を含む）。`fields.username` = `TAKEN`。
      メールアドレスの状態は応答に含めない。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Error.yaml
        examples:
          usernameTaken:
            value:
              error:
                code: USERNAME_TAKEN
                message: このユーザー名は使用できません。
                fields:
                  username: TAKEN
                request_id: 7f3c9b1e2a4d4c0e9a51
  "413":
    $ref: ../components/responses/RequestTooLarge.yaml
  "415":
    $ref: ../components/responses/UnsupportedMediaType.yaml
  "429":
    $ref: ../components/responses/RateLimited.yaml
  "500":
    $ref: ../components/responses/InternalError.yaml
  "503":
    $ref: ../components/responses/ServiceUnavailableQueueFull.yaml
