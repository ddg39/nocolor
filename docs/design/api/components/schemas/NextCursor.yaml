type: [string, "null"]
title: NextCursor
description: |
  次のページを取得するためのカーソル。**クライアントにとって不透明な文字列**で、中身を解釈・加工してはならない（README 1.7）。
  次のページが無いときは `null`（終端）。0 件のときも `null`。
  次のページの有無は `limit + 1` 件を取得して判定するため、`limit` 件ちょうどで終わる場合も、余りの 1 件が無ければ `null` になる
  （空のページを 1 回余計に返さない）。
examples:
  - AQ3v1o8Kx2m0
  - null
