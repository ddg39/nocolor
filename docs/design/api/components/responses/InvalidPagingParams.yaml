description: |
  400。一覧 API（API-11、12、19、22、23）のページングのパラメータが不正（README 1.7）。
  - `INVALID_CURSOR`: `cursor` が改ざん・破損・別の一覧（別のユーザー）のもの。
  - `VALIDATION_ERROR`: `limit` が範囲外または整数でない。`fields.limit` = `INVALID_VALUE`。
content:
  application/json:
    schema:
      $ref: ../schemas/Error.yaml
    examples:
      invalidCursor:
        summary: カーソルが不正
        value:
          error:
            code: INVALID_CURSOR
            message: カーソルが不正です。
            fields: {}
            request_id: 7f3c9b1e2a4d4c0e9a51
      invalidLimit:
        summary: limit が範囲外
        value:
          error:
            code: VALIDATION_ERROR
            message: 入力内容を確認してください。
            fields:
              limit: INVALID_VALUE
            request_id: 7f3c9b1e2a4d4c0e9a51
