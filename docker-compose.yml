# 開発用の構成（ADR 001）。ブラウザからは http://localhost/ でアクセスする。
services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80" # 外部に公開するのはこのポートのみ
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
    volumes:
      - ./src/frontend:/app
      # ホスト側のマウントでイメージ内の node_modules が隠れないようにする
      - /app/node_modules
