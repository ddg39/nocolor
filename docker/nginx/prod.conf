# 本番用: ビルド済みの静的ファイルを配信する（ADR 001）
# /api/* と /images/* は backend・MinIO を追加するときに設定する。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite がハッシュ付きのファイル名で出力するため、長期間キャッシュしてよい
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA のクライアント側ルーティングのため、該当ファイルがなければ index.html を返す
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
